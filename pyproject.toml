[project]
name = "jev-decision-lab"
version = "0.1.0"
description = "A developer workbench for Jev's Choice, Score, and Noul primitives."
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "matplotlib>=3.10,<4",
    "pytest>=8.4",
    "ruff>=0.12",
]

[project.scripts]
jev-demo = "jev_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/jev_demo"]

[tool.fastapi]
entrypoint = "jev_demo.app:app"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "FAST"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["backend", "tests", "scripts"]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["jev_demo"]
